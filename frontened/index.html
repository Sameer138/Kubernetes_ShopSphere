<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>ShopSphere</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }
        header {
            background: #111827;
            color: white;
            padding: 20px 40px;
        }
        header h1 {
            margin-bottom: 5px;
        }
        header p {
            color: #d1d5db;
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section {
            margin-bottom: 40px;
        }
        .section h2 {
            margin-bottom: 20px;
        }
        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .product-card h3 {
            margin-bottom: 10px;
        }
        .product-description {
            color: #6b7280;
            margin-bottom: 15px;
        }
        .price {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }
        th {
            background: #f3f4f6;
        }
        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            background: #dcfce7;
            color: #166534;
        }
        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
        }
        .success {
            background: #dcfce7;
            color: #166534;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
        .loading {
            color: #6b7280;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }
    </style>
</head>
<body>
<header>
    <h1>ShopSphere</h1>
    <p>Kubernetes-powered e-commerce platform</p>
</header>
<div class="container">
    <div id="message" class="message"></div>
    <section class="section">
        <h2>Products</h2>
        <div id="products" class="products">
            <p class="loading">Loading products...</p>
        </div>
    </section>
    <section class="section">
        <h2>Orders</h2>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Product ID</th>
                    <th>Quantity</th>
                    <th>Status</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody id="orders">
                <tr>
                    <td colspan="5">
                        Loading orders...
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</div>
<footer>
    ShopSphere &copy; 2026
</footer>
<script src="/app.js"></script>
</body>
</html>
