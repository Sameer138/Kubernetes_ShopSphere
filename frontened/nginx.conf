server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kubernetes / load-balancer health endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
    }
}
