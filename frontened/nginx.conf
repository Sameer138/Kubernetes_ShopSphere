server {
    listen 80;
    server_name localhost;
    # Serve the frontend static files (index.html, app.js)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    # Forward backend API requests to your API service
    # CHANGE 'backend-service-name' to your actual backend container name or service name
    location /api/ {
        proxy_pass http://backend-service:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Forward health check requests to the backend
    location /health {
        proxy_pass http://backend-service:8000;
        proxy_set_header Host $host;
    }
}
