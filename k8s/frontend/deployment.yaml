apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-apps
  template:
    metadata:
      labels:
        app: front-apps
    spec:
      containers:
        - name: front-container
          image: shop-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi