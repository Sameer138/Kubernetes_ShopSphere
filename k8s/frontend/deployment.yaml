apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: shopsphere

spec:

  replicas: 2

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:

    matchLabels:
      app: frontend

  template:

    metadata:

      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: shop-front:v1

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 80

          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:

            httpGet:
              path: /nginx-health
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /nginx-health
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10