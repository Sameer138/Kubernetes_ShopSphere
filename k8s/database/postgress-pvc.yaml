apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-pvc
  namespace: shopsphere

spec:

  accessModes:
    - ReadWriteOnce

  storageClassName: manual

  resources:

    requests:
      storage: 2Gi