apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopsphere-ingress
  namespace: shopsphere
  annotations:
    # Specifies the NGINX Ingress Controller should pick up this resource
    kubernetes.io/ingress.class: nginx
    # Optional: Enable path rewrites if your backend application does not explicitly have /api coded in its routes
    # nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: shopsphere.local
    http:
      paths:
      # Route /api traffic to the backend API service
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service # Use 'order-api' if you renamed this service earlier
            port:
              number: 8000
      # Route /shop traffic to the frontend UI service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service # Make sure this matches your exact frontend service name
            port:
              number: 80
